# Add-on file for computers with an NVIDIA GPU (Linux, or Windows with WSL2).
# Use it together with compose.yaml:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
# Needs the NVIDIA driver + NVIDIA Container Toolkit installed first (see README).

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
