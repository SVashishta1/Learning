{{- /* Only create the Ingress when ingress.enabled is true in the values. */ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hello-ai.fullname" . }}
  labels:
    {{- include "hello-ai.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "hello-ai.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
