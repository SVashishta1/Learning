apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello-ai.fullname" . }}
  labels:
    {{- include "hello-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hello-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hello-ai.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: hello-ai
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-listen=:{{ .Values.containerPort }}"
            - {{ printf "-text=%s" .Values.message | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          readinessProbe:          # send traffic only when /health answers
            httpGet:
              path: /health
              port: http
          livenessProbe:           # restart the container if /health stops answering
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
