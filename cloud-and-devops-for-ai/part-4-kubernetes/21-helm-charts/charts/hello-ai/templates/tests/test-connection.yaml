# A "test hook": not installed with the chart. "helm test <release>" runs this pod,
# which calls the Service once. Exit code 0 = test passed.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hello-ai.fullname" . }}-test
  labels:
    {{- include "hello-ai.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget", "-qO-", "-T", "5", "http://{{ include "hello-ai.fullname" . }}:{{ .Values.service.port }}"]
