# rag-service: a Deployment (the pods) + a Service (one stable name and address for them).
# Two objects in one file, separated by "---".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      containers:
        - name: rag-service
          image: ai-rag-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service        # other pods can now call http://rag-service:8000
spec:
  type: ClusterIP          # the default: reachable only from INSIDE the cluster
  selector:
    app: rag-service       # send traffic to pods wearing this label
  ports:
    - port: 8000           # the port the Service listens on
      targetPort: 8000     # the port on the pods it forwards to
