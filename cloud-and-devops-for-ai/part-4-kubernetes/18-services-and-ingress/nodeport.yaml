# A NodePort Service: opens the same port (30080) on EVERY node and forwards it to llm-service pods.
# kind-config.yaml (lesson 16) maps node port 30080 to port 30080 on your laptop.
apiVersion: v1
kind: Service
metadata:
  name: llm-service-nodeport
spec:
  type: NodePort
  selector:
    app: llm-service
  ports:
    - port: 8000         # the Service's own port inside the cluster
      targetPort: 8000   # the pods' port
      nodePort: 30080    # the port opened on every node (allowed range: 30000-32767)
