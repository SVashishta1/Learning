# llm-service that reads its settings from the ConfigMap and its API key from the Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-service
  template:
    metadata:
      labels:
        app: llm-service
    spec:
      containers:
        - name: llm-service
          image: ai-llm-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:                       # turn EVERY key of the ConfigMap into an environment variable
            - configMapRef:
                name: llm-config
          env:                           # pick ONE key out of the Secret
            - name: ANTHROPIC_API_KEY    # the variable name inside the container
              valueFrom:
                secretKeyRef:
                  name: anthropic-api    # the Secret's name
                  key: ANTHROPIC_API_KEY # the key inside the Secret
                  optional: true         # start anyway if the Secret doesn't exist (fake mode needs no key)
