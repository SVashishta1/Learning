# A Secret written as YAML. ONLY safe to keep in git because this key is FAKE.
# For a real key, use "kubectl create secret ..." (see the README) and never save it in a file.
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-api
type: Opaque                   # "Opaque" = any data you like (as opposed to special types like TLS certificates)
stringData:                    # plain text here; Kubernetes stores it base64-encoded under "data:"
  ANTHROPIC_API_KEY: "sk-ant-this-is-not-a-real-key"
