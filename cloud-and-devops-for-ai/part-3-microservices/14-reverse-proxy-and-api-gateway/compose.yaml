# Lesson 13's app with nginx as the ONE front door.
# Only nginx has "ports:". Everything else is reachable only inside the Compose network.
# Start with:  docker compose up -d --build

name: ai-proxy

services:
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "8080:80"
    volumes:
      # Our config replaces nginx's main config file. ":ro" = read-only inside the container.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Our web page.
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: ../13-queues-and-background-workers/gateway
    image: ai-gateway:1.1
    environment:
      RAG_URL: http://rag-service:8000
      LLM_URL: http://llm-service:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ../13-queues-and-background-workers/worker
    image: ai-worker:1.0
    environment:
      RAG_URL: http://rag-service:8000
      LLM_URL: http://llm-service:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rag-service:
    build: ../12-split-an-ai-app-into-services/rag-service
    image: ai-rag-service:1.0
    restart: unless-stopped

  llm-service:
    build: ../12-split-an-ai-app-into-services/llm-service
    image: ai-llm-service:1.0
    environment:
      FAKE_LLM: ${FAKE_LLM:-1}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
