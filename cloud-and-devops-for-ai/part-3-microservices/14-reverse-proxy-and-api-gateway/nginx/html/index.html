<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moonbeam Coffee helper</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 16px; background: #fdfaf6; color: #222; }
    input { width: 100%; padding: .6rem; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: .5rem; padding: .5rem 1rem; font-size: 1rem; }
    pre { background: #fff; border: 1px solid #ddd; padding: .8rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Moonbeam Coffee helper</h1>
  <p>This page is served by nginx. The buttons call <code>/api/...</code>, which nginx forwards to the gateway.</p>
  <input id="q" value="Is the wifi free?">
  <button onclick="askNow()">Ask (wait for answer)</button>
  <button onclick="askLater()">Ask as background job</button>
  <pre id="out">The answer appears here.</pre>

  <script>
    const out = document.getElementById("out");
    const question = () => document.getElementById("q").value;

    // POST /api/ask: one request, wait for the answer.
    async function askNow() {
      out.textContent = "Thinking...";
      const r = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question() }),
      });
      out.textContent = r.status + " " + r.statusText + "\n" + JSON.stringify(await r.json(), null, 2);
    }

    // POST /api/jobs, then poll GET /api/jobs/<id> every second until it is done.
    async function askLater() {
      const r = await fetch("/api/jobs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question() }),
      });
      const job = await r.json();
      if (!r.ok) { out.textContent = r.status + "\n" + JSON.stringify(job, null, 2); return; }
      while (true) {
        const s = await (await fetch("/api/jobs/" + job.job_id)).json();
        out.textContent = "job " + job.job_id + ": " + s.status + (s.answer ? "\n\n" + s.answer : "");
        if (s.status === "done" || s.status === "failed") break;
        await new Promise(res => setTimeout(res, 1000));
      }
    }
  </script>
</body>
</html>
