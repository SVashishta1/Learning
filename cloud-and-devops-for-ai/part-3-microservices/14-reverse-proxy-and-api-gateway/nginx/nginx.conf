# nginx in front of the AI app: one front door, path routing, rate limits, request IDs.
# Check it (while the app is running) with:  docker compose exec nginx nginx -t

# How many worker processes nginx starts. "auto" = one per CPU core.
worker_processes auto;

events {
    # Each worker may hold up to 1024 open connections at the same time.
    worker_connections 1024;
}

http {
    # Know the right Content-Type for .html, .css, .js ... files.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Don't print the nginx version in error pages and headers (less info for attackers).
    server_tokens off;

    # One log line per request, including the request ID and how long the gateway took.
    log_format main '$remote_addr "$request" status=$status bytes=$body_bytes_sent '
                    'request_id=$request_id upstream=$upstream_addr upstream_time=$upstream_response_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ---------- Rate limiting ----------
    # A "zone" is a small shared notebook that counts requests per client IP address.
    # api: 10 requests per second per IP for normal API calls.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # llm: 2 requests per second per IP for the expensive AI endpoints.
    limit_req_zone $binary_remote_addr zone=llm:10m rate=2r/s;
    # Answer "429 Too Many Requests" (instead of the default 503) when a limit is hit.
    limit_req_status 429;

    # ---------- Where the gateway lives ----------
    # Ask Docker's built-in DNS server (always at 127.0.0.11) for container addresses,
    # and look them up again every 10 s, because containers get new addresses when they restart.
    resolver 127.0.0.11 valid=10s;

    # "gateway" is the Docker Compose service name. With several gateway containers,
    # nginx takes turns between them (round robin).
    upstream gateway_upstream {
        zone gateway_upstream 64k;     # shared memory, needed so "resolve" can update the address list
        server gateway:8000 resolve;   # keep re-checking what "gateway" points to
    }

    server {
        listen 80;
        server_name _;          # "_" = any host name
        client_max_body_size 1m; # refuse request bodies bigger than 1 MB

        # Headers added to every request nginx forwards to the gateway.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;  # a random ID nginx makes for each request

        # Time limits for talking to the gateway.
        proxy_connect_timeout 2s;  # give up if the gateway doesn't pick up within 2 s
        proxy_read_timeout    60s; # give up if the answer takes longer than 60 s

        # Also send the request ID back to the caller, so they can quote it in a bug report.
        add_header X-Request-ID $request_id always;

        # 1. The web page: files from /usr/share/nginx/html (our nginx/html folder).
        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        # 2. nginx's own health check. Answered by nginx itself, never forwarded.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 3. The expensive AI endpoints: strict limit (2/s, plus a queue of 4 extra).
        #    "=" means this exact path only.
        location = /api/ask {
            limit_req zone=llm burst=4 nodelay;
            proxy_pass http://gateway_upstream/ask;
        }
        location = /api/jobs {
            limit_req zone=llm burst=4 nodelay;
            proxy_pass http://gateway_upstream/jobs;
        }

        # 4. Everything else under /api/ goes to the gateway, with "/api" cut off:
        #    /api/health -> gateway /health,  /api/jobs/abc -> gateway /jobs/abc
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://gateway_upstream/;
        }

        # 5. A friendly JSON message instead of nginx's HTML error page when a limit is hit.
        error_page 429 = @too_many_requests;
        location @too_many_requests {
            default_type application/json;
            return 429 '{"detail": "Too many requests. Please slow down and try again in a second."}\n';
        }
    }
}
