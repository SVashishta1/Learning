# The fixed version of ../insecure/deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-api
  template:
    metadata:
      labels:
        app: secure-api
    spec:
      automountServiceAccountToken: false     # the app never talks to the Kubernetes API, so no token
      securityContext:
        runAsNonRoot: true                    # refuse to start if the image would run as root
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault                # block rarely used, dangerous kernel calls
      containers:
        - name: api
          image: secure-api:1.0.0             # an exact version, never "latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:                 # read the key from a Kubernetes Secret, not from this file
                  name: anthropic
                  key: api-key
          securityContext:
            allowPrivilegeEscalation: false   # no sudo-style tricks inside the container
            readOnlyRootFilesystem: true      # the app cannot change its own files
            capabilities:
              drop: ["ALL"]                   # remove every special Linux power
          resources:
            requests:                         # what the scheduler reserves for the pod
              cpu: 50m
              memory: 64Mi
            limits:                           # the most the pod may use
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          volumeMounts:
            - name: tmp                       # a writable scratch folder, since the root filesystem is read-only
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
