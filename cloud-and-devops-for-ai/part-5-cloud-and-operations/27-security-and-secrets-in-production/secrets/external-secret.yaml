# READ-ONLY EXAMPLE (needs a real cloud account and the External Secrets Operator installed).
# The secret lives in AWS Secrets Manager. The operator copies it into a normal Kubernetes
# Secret called "anthropic" and refreshes it every hour, so nobody pastes keys into YAML files.
#
# Install the operator first: https://external-secrets.io/latest/introduction/getting-started/
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:                                 # log in to AWS with the operator's Kubernetes identity
          serviceAccountRef:                 # (IRSA / EKS Pod Identity): no AWS keys stored anywhere
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anthropic
  namespace: ai-app
spec:
  refreshInterval: 1h                        # re-read the cloud secret every hour (picks up rotations)
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: anthropic                          # the Kubernetes Secret to create
    creationPolicy: Owner
  data:
    - secretKey: api-key                     # key inside the Kubernetes Secret
      remoteRef:
        key: prod/ai-app/anthropic-api-key   # name of the secret in AWS Secrets Manager
