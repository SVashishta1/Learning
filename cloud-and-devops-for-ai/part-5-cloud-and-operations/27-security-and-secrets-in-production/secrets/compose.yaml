# Give a container a secret as a FILE, not as an environment variable or an image layer.
# Before "docker compose up", create the file (it is git-ignored):
#   echo "sk-ant-this-is-not-a-real-key" > anthropic_api_key.txt
services:
  api:
    build: ../secure              # the hardened image from ../secure/Dockerfile
    image: secure-api:1.0.0
    ports:
      - "8000:8000"
    secrets:
      - anthropic_api_key         # appears inside the container as /run/secrets/anthropic_api_key

secrets:
  anthropic_api_key:
    file: ./anthropic_api_key.txt # where the secret comes from on YOUR machine
