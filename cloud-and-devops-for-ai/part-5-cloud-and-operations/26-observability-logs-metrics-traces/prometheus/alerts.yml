# Alert rules: Prometheus checks these questions all the time.
# If an expression returns something for longer than "for", the alert FIRES.
# (Sending emails/Slack messages is the job of a separate tool, Alertmanager, not used here.)
groups:
  - name: ask-api
    rules:
      - alert: AskApiHighErrorRate
        # share of /ask requests answered with a 5xx code over the last 2 minutes
        expr: |
          sum(rate(http_requests_total{path="/ask", status=~"5.."}[2m]))
            / sum(rate(http_requests_total{path="/ask"}[2m])) > 0.10
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "More than 10% of /ask requests fail"
          description: "Check the llm_errors_total metric and the error logs of the api container."

      - alert: AskApiSlowLLM
        # 95 % of model calls are faster than this number of seconds
        expr: histogram_quantile(0.95, sum by (le) (rate(llm_request_duration_seconds_bucket[5m]))) > 5
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "p95 LLM latency above 5 seconds"

      - alert: AskApiDown
        expr: up{job="ask-api"} == 0
        for: 30s
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape the ask-api"
