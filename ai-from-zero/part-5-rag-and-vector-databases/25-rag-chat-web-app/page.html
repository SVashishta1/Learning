<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat with your documents</title>
<style>
 *{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#f4f6f5;color:#15211c;height:100vh;display:flex;flex-direction:column}
 header{padding:12px 16px;background:#1d3b2f;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
 header b{margin-right:auto} label{background:#2f6b52;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:14px}
 #docs{font-size:13px;opacity:.85;width:100%} #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:780px;width:100%;margin:0 auto}
 .msg{padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.45}
 .user{align-self:flex-end;background:#2f6b52;color:#fff} .bot{align-self:flex-start;background:#fff;border:1px solid #d7e0db}
 .src{font-size:12px;color:#5b6d64;margin-top:6px;white-space:normal}
 form{display:flex;gap:8px;padding:12px 16px;max-width:780px;width:100%;margin:0 auto}
 input[type=text]{flex:1;font:inherit;padding:12px;border-radius:12px;border:1px solid #c3cfc8} button{font:inherit;padding:0 18px;border-radius:12px;border:0;background:#1d3b2f;color:#fff}
 @media (prefers-color-scheme:dark){body{background:#0f1613;color:#e3ece7}.bot{background:#17211c;border-color:#2b3a33}.src{color:#9db0a6}input[type=text]{background:#17211c;color:#e3ece7;border-color:#2b3a33}}
</style></head>
<body>
<header><b>📚 Chat with your documents</b><label>⬆ Upload PDF / TXT / MD<input type="file" id="file" accept=".pdf,.txt,.md" hidden></label><div id="docs"></div></header>
<div id="log"></div>
<form onsubmit="send(event)"><input type="text" id="box" placeholder="Ask about your documents..." autocomplete="off" autofocus><button>Ask</button></form>
<script>
const chatId = Math.random().toString(36).slice(2);
function bubble(cls, text){ const d=document.createElement("div"); d.className="msg "+cls; d.textContent=text;
  const log=document.getElementById("log"); log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
async function loadDocs(){ const docs=await (await fetch("/documents")).json(); document.getElementById("docs").textContent="In the library: "+docs.join(", "); }
async function send(e){
  e.preventDefault(); const box=document.getElementById("box"), text=box.value.trim(); if(!text) return;
  box.value=""; bubble("user", text); const bot=bubble("bot", "Searching your documents…");
  const r=await fetch("/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:chatId,text})});
  if(!r.ok){ bot.textContent="⚠️ Something went wrong. Look at the terminal where uvicorn is running."; return; }
  const d=await r.json(); bot.textContent=d.reply; const s=document.createElement("div"); s.className="src";
  s.textContent="Sources: "+d.sources.map(x=>`[${x.n}] ${x.source}`).join("  "); bot.appendChild(s);
}
document.getElementById("file").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const fd=new FormData(); fd.append("file", f);
  bubble("user","📄 Uploading "+f.name+"…"); const r=await fetch("/upload",{method:"POST",body:fd}); const d=await r.json();
  if(!r.ok){ bubble("bot","⚠️ "+(d.detail||"Upload failed.")); return; }
  bubble("bot","Added "+d.file+" ("+d.chunks+" chunks). Ask me about it!"); loadDocs(); e.target.value=""; };
loadDocs();
</script></body></html>
