<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Chatbot</title>
<style>
 *{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#f3f5f7;color:#16202a;height:100vh;display:flex;flex-direction:column}
 header{padding:14px 16px;background:#16202a;color:#fff;font-weight:700} #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
 .msg{padding:10px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap;line-height:1.45}
 .user{align-self:flex-end;background:#2563eb;color:#fff} .bot{align-self:flex-start;background:#fff;border:1px solid #dde3ea}
 form{display:flex;gap:8px;padding:12px 16px;max-width:760px;width:100%;margin:0 auto}
 input{flex:1;font:inherit;padding:12px;border-radius:12px;border:1px solid #cbd3dc} button{font:inherit;padding:0 18px;border-radius:12px;border:0;background:#16202a;color:#fff;cursor:pointer}
 @media (prefers-color-scheme:dark){body{background:#0e141a;color:#e6edf3}.bot{background:#18212b;border-color:#2a3644}input{background:#18212b;color:#e6edf3;border-color:#2a3644}}
</style></head>
<body>
<header>🤖 My Chatbot <button onclick="newChat()" style="float:right;background:#334;padding:4px 10px">New chat</button></header>
<div id="log"></div>
<form onsubmit="send(event)"><input id="box" placeholder="Type a message..." autocomplete="off" autofocus><button>Send</button></form>
<script>
let chatId = localStorage.getItem("chatId") || newId();
function newId(){ const id = Math.random().toString(36).slice(2); localStorage.setItem("chatId", id); return id; }
function newChat(){ chatId = newId(); document.getElementById("log").innerHTML = ""; }
function bubble(cls, text){ const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  const log = document.getElementById("log"); log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
async function send(e){
  e.preventDefault(); const box = document.getElementById("box"); const text = box.value.trim(); if(!text) return;
  box.value = ""; bubble("user", text); const bot = bubble("bot", "…");
  const r = await fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({chat_id: chatId, text})});
  const reader = r.body.getReader(), decoder = new TextDecoder(); bot.textContent = "";
  while(true){ const {done, value} = await reader.read(); if(done) break; bot.textContent += decoder.decode(value); }
}
fetch("/history/" + chatId).then(r => r.json()).then(msgs => msgs.forEach(m => bubble(m.role === "user" ? "user" : "bot", m.content)));
</script></body></html>
