<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draw a digit</title>
<style>
 body{font-family:system-ui;background:#111820;color:#eef;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}
 canvas{background:#000;border-radius:12px;touch-action:none;width:min(280px,90vw);aspect-ratio:1;border:2px solid #345}
 #guess{font-size:80px;font-weight:800;text-align:center} button{font:inherit;padding:10px 18px;border-radius:10px;border:0;cursor:pointer}
 .bar{display:grid;grid-template-columns:18px 1fr 42px;gap:8px;align-items:center} .bar div{height:10px;background:#4cc;border-radius:5px}
</style></head>
<body><div style="display:grid;gap:12px;width:min(320px,100%)">
 <h2 style="margin:0">Draw a digit 0–9</h2>
 <canvas id="c" width="280" height="280"></canvas>
 <div id="guess">?</div><button onclick="clearIt()">Clear</button><div id="bars"></div>
</div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");x.lineWidth=22;x.lineCap="round";x.strokeStyle="#fff";
let down=false;
const pos=e=>{const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*280/r.width,(t.clientY-r.top)*280/r.height]};
c.onpointerdown=e=>{down=true;x.beginPath();x.moveTo(...pos(e))};
c.onpointermove=e=>{if(down){x.lineTo(...pos(e));x.stroke()}};
c.onpointerup=c.onpointerleave=()=>{if(down){down=false;ask()}};
function clearIt(){x.fillStyle="#000";x.fillRect(0,0,280,280);document.getElementById("guess").textContent="?";document.getElementById("bars").innerHTML=""}
async function ask(){
 const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:c.toDataURL()})});
 const d=await r.json();document.getElementById("guess").textContent=d.digit??"?";
 document.getElementById("bars").innerHTML=d.confidence.map((p,i)=>`<div class="bar"><span>${i}</span><div style="width:${p*100}%"></div><span>${Math.round(p*100)}%</span></div>`).join("")}
clearIt();
</script></body></html>
