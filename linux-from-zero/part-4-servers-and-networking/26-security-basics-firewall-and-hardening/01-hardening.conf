# 01-hardening.conf - safer SSH server settings.
# Installed by apply-ssh-hardening.sh into /etc/ssh/sshd_config.d/ (a "drop-in" folder that the
# main /etc/ssh/sshd_config includes at its top). For each setting, the FIRST value sshd reads wins.
# Drop-ins are read in alphabetical order, before the rest of the main file. The name starts with 01
# so it beats files like 50-cloud-init.conf, which cloud images use to switch passwords ON.

# Nobody may log in directly as root. Log in as yourself, then use sudo (it is logged).
PermitRootLogin no

# Keys only: no passwords, so password-guessing robots get nowhere.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# At most 3 tries per connection, and 30 seconds to finish logging in.
MaxAuthTries 3
LoginGraceTime 30

# No graphical-window forwarding (not needed on a server).
X11Forwarding no

# Disconnect dead sessions: check every 300 s, give up after 2 missed answers.
ClientAliveInterval 300
ClientAliveCountMax 2

# Optional, even stricter: only these users may log in at all (space-separated). Remove the # to use it.
# AllowUsers learner
