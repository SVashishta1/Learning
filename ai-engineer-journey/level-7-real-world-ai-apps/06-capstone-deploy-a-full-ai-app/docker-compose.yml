# The app + Prometheus (metrics database) + Grafana (dashboards). Run: docker compose up --build
services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-5-5}
      APP_API_KEYS: ${APP_API_KEYS:-dev-key-123}
      DAILY_BUDGET_USD: "2.0"
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
