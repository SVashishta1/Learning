# Render "Blueprint": creates the web service + a free Postgres database from this file.
services:
  - type: web
    name: login-todo-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: login-todo-db
          property: connectionString
databases:
  - name: login-todo-db
    plan: free
