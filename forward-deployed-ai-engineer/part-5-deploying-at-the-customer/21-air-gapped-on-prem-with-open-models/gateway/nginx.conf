# The ONLY door into the isolated network: forwards http://<host>:8000 to the assistant.
server {
    listen 8000;
    location / {
        proxy_pass http://assistant:8000;      # "assistant" = the compose service name on the airgap network
        proxy_read_timeout 300s;               # local models on CPU can take minutes
        proxy_set_header Host $host;
    }
}
