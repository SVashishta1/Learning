# EXAMPLE ONLY. Never commit real secrets. Create the real one with:
#   kubectl -n northwind-claims create secret generic claims-desk-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... --from-literal=MOCK_CLIENT_SECRET=...
# At a customer, use their secret manager (External Secrets Operator, Vault, AWS/GCP/Azure secret managers).
apiVersion: v1
kind: Secret
metadata:
  name: claims-desk-secrets
  namespace: northwind-claims
type: Opaque
stringData:                         # stringData = plain text here; Kubernetes stores it base64-encoded
  ANTHROPIC_API_KEY: ""
  MOCK_CLIENT_SECRET: "claims-desk-secret-change-me"
