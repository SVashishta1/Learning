apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-desk
  namespace: northwind-claims
spec:
  replicas: 1                       # runs live in memory: keep ONE replica until runs are stored in a database
  selector:
    matchLabels: {app: claims-desk}
  template:
    metadata:
      labels: {app: claims-desk}
    spec:
      securityContext:
        runAsNonRoot: true          # refuse to start if the image would run as root
        runAsUser: 10001
      containers:
        - name: claims-desk
          image: northwind/claims-desk:0.1.0
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: claims-desk-config}
            - secretRef: {name: claims-desk-secrets}
          readinessProbe:           # "ready for traffic?" -> only then does the Service send requests
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          livenessProbe:            # "still alive?" -> if not, Kubernetes restarts the container
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: claims-desk
  namespace: northwind-claims
spec:
  selector: {app: claims-desk}
  ports: [{port: 80, targetPort: 8000}]
