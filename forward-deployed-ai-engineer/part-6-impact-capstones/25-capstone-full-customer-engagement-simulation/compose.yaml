# docker compose up --build                 -> FAKE mode, no key: claims desk on http://localhost:8000
# FAKE_LLM=0 ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
# FAKE_LLM=0 LLM_PROVIDER=ollama docker compose --profile local up --build -d ; docker compose exec ollama ollama pull qwen2.5:7b
services:
  mock-api:                                    # pretend HelpDesk + TMS gateway + Finance (in real life: the customer's systems)
    build: .
    command: ["uvicorn", "mock_api:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      PORT: "8100"                             # used by the HEALTHCHECK in the Dockerfile
      FAIL_RATE: ${FAIL_RATE:-0.1}             # 10% of reads fail with 503: the desk must retry
      MOCK_CLIENT_SECRET: ${MOCK_CLIENT_SECRET:-claims-desk-secret-change-me}

  claims-desk:
    build: .
    ports:
      - "8000:8000"
    environment:
      MOCK_API_URL: http://mock-api:8100
      MOCK_CLIENT_SECRET: ${MOCK_CLIENT_SECRET:-claims-desk-secret-change-me}
      FAKE_LLM: ${FAKE_LLM:-1}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      SPECIALIST_MODEL: ${SPECIALIST_MODEL:-claude-haiku-5-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    depends_on:
      mock-api:
        condition: service_healthy             # wait until the mock answers /healthz
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.8
    profiles: ["local"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
