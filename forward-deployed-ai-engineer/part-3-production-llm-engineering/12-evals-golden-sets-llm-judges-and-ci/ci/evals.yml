# GitHub Actions workflow: run the tests and evals on every pull request that touches this lesson.
# To use it, copy this file to .github/workflows/evals.yml at the ROOT of your repository
# (GitHub only reads workflows from there), then push.
name: evals

on:
  pull_request:
    paths:
      - "forward-deployed-ai-engineer/part-3-production-llm-engineering/12-evals-golden-sets-llm-judges-and-ci/**"
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read              # least privilege: this job only reads the code

env:
  LESSON: forward-deployed-ai-engineer/part-3-production-llm-engineering/12-evals-golden-sets-llm-judges-and-ci

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.LESSON }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # empty on forks and before you add the secret
      CLAUDE_MODEL: claude-haiku-5-5                         # cheap model for the system under test
      JUDGE_MODEL: claude-opus-5-5                           # strong model for the judge
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.LESSON }}/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Unit tests (free, no key)
        run: pytest -q

      - name: Baseline evals and regression gate (free, no key)
        run: python run_evals.py --system rules --version v2

      - name: LLM evals and gate (only when the API key secret exists)
        if: env.ANTHROPIC_API_KEY != ''
        run: python run_evals.py --system llm --version v2 --judge --baseline baseline_llm.json

      - name: Build the dashboard
        if: always()
        run: python dashboard.py

      - name: Keep the results for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: ${{ env.LESSON }}/results/
          retention-days: 30
